buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    unitTest
}

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.spongepowered:mixin:0.8.5'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    unitTestImplementation sourceSets.main.output
    unitTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    unitTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ForgeGradle + Windows non-ASCII project path breaks plain `test` classpath.
def jvmTestStagingDir = file("${System.getProperty('java.io.tmpdir')}/${mod_id}-jvm-test-staging")

tasks.register('prepareJvmTestStaging', Sync) {
    dependsOn unitTestClasses, processResources
    from sourceSets.unitTest.output.classesDirs
    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir
    into jvmTestStagingDir
}

tasks.register('unitTest', Test) {
    description = 'Pure JVM unit tests without Forge bootstrap (Windows-safe classpath)'
    group = 'verification'
    useJUnitPlatform()
    dependsOn prepareJvmTestStaging
    testClassesDirs = sourceSets.unitTest.output.classesDirs
    classpath = files(jvmTestStagingDir) + configurations.unitTestRuntimeClasspath
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    enabled = false
}

tasks.named('check').configure {
    dependsOn unitTest
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.register('copyJarToReleases', Copy) {
    group = 'build'
    description = 'Copy the built mod jar into releases/ (preserves older versions)'
    dependsOn reobfJar
    from(tasks.named('jar', Jar).map { it.archiveFile })
    into(layout.projectDirectory.dir('releases'))
    doLast {
        logger.lifecycle("Archived jar -> releases/${tasks.named('jar', Jar).get().archiveFileName.get()}")
    }
}

tasks.named('build').configure {
    finalizedBy copyJarToReleases
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
